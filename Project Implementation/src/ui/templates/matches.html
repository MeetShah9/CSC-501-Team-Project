{% extends "base.html" %}{% block body %}
<h1>Matches</h1><p class="sub">All {{ matches|length }} Bundesliga matches of Bayer Leverkusen, 2023/24.</p>
<table><tr><th>Date</th><th>Venue</th><th>Opponent</th><th>StatsBomb id</th><th></th></tr>
{% for m in matches %}<tr><td>{{ m.MatchDate }}</td><td>{{ m.Venue }}</td><td>{{ m.Opponent }}</td><td>{{ m.SbMatchId }}</td>
<td><a href="{{ url_for('events', match_id=m.Id) }}">events</a> · <a href="{{ url_for('events', match_id=m.Id, event_type='Shot') }}">shots</a></td></tr>{% endfor %}</table>
{% endblock %}
