<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 240" role="img" aria-labelledby="t d">
  <title id="t">Pass to goal: Andrich to Wirtz</title>
  <desc id="d">Tactics-board drawing of Leverkusen v Werder Bremen, 14 April 2024: Robert Andrich's pass at 67:22 is intended for Florian Wirtz, who scores at 67:25.</desc>
  <defs>
    <marker id="pass" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ffffff"/>
    </marker>
    <marker id="shot" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ffd84d"/>
    </marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>

  <!-- board -->
  <rect x="2" y="2" width="416" height="236" rx="12" fill="#1f4d2c" fill-opacity=".55" stroke="#ffffff" stroke-opacity=".25"/>

  <!-- half pitch markings (attacking towards the goal on the right) -->
  <g fill="none" stroke="#ffffff" stroke-opacity=".7" stroke-width="2">
    <rect x="20" y="20" width="380" height="200"/>
    <line x1="20" y1="20" x2="20" y2="220"/>
    <path d="M20 70 A50 50 0 0 1 20 170"/>
    <rect x="310" y="55" width="90" height="130"/>
    <rect x="370" y="90" width="30" height="60"/>
    <path d="M310 95 A42 42 0 0 0 310 145"/>
    <rect x="400" y="102" width="12" height="36" stroke-opacity=".95"/>
  </g>
  <circle cx="340" cy="120" r="2.5" fill="#ffffff" fill-opacity=".8"/>
  <circle cx="20" cy="120" r="2.5" fill="#ffffff" fill-opacity=".8"/>

  <!-- pass: Andrich -> Wirtz (intended for) -->
  <path d="M152 162 Q 230 150 292 98" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#pass)"/>
  <!-- shot: Wirtz -> goal (assisted shot) -->
  <path d="M312 92 L 398 112" fill="none" stroke="#ffd84d" stroke-width="3" marker-end="url(#shot)"/>

  <!-- opponents (Werder Bremen), muted -->
  <g fill="#ffffff" fill-opacity=".9" stroke="#1f4d2c" stroke-width="1.5">
    <circle cx="255" cy="150" r="7"/>
    <circle cx="335" cy="140" r="7"/>
    <circle cx="350" cy="78" r="7"/>
  </g>
  <rect x="384" y="112" width="12" height="16" rx="3" fill="#ffffff" fill-opacity=".9"/>

  <!-- Leverkusen players -->
  <g filter="url(#sh)">
    <circle cx="140" cy="168" r="11" fill="#e32219" stroke="#111316" stroke-width="2.5"/>
    <circle cx="302" cy="90" r="11" fill="#e32219" stroke="#111316" stroke-width="2.5"/>
    <circle cx="95" cy="95" r="8" fill="#e32219" stroke="#111316" stroke-width="2" opacity=".75"/>
    <circle cx="215" cy="70" r="8" fill="#e32219" stroke="#111316" stroke-width="2" opacity=".75"/>
  </g>

  <!-- ball in the net -->
  <circle cx="406" cy="114" r="4.5" fill="#ffffff" stroke="#111316" stroke-width="1.5"/>

  <!-- labels -->
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="600">
    <rect x="62" y="186" width="128" height="34" rx="6" fill="#111316" fill-opacity=".85"/>
    <text x="72" y="200" fill="#ffffff">Andrich · Pass</text>
    <text x="72" y="214" fill="#ff8a84" font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="700">P2 67:22</text>

    <rect x="226" y="24" width="122" height="34" rx="6" fill="#111316" fill-opacity=".85"/>
    <text x="236" y="38" fill="#ffffff">Wirtz · Shot</text>
    <text x="236" y="52" fill="#ff8a84" font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="700">P2 67:25</text>
    <rect x="300" y="41" width="40" height="15" rx="7.5" fill="#e6f4ea"/>
    <text x="320" y="52" fill="#146c2e" font-size="10" text-anchor="middle">GOAL</text>

    <text x="196" y="138" fill="#ffffff" fill-opacity=".9" font-size="10.5" font-weight="500" transform="rotate(-24 196 138)">intended for</text>
    <text x="330" y="118" fill="#ffd84d" font-size="10.5" font-weight="500" transform="rotate(13 330 118)">assists</text>
  </g>
</svg>
