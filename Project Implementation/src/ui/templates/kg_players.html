{% extends "kg_base.html" %}{% block body %}
<h1>Players</h1><p class="sub">{{ rows|length }} players shown.</p>
<div class="card"><form class="filters" method="get"><label>Name contains<input name="q" value="{{ q }}" placeholder="e.g. Wirtz"></label><button class="btn">Search</button></form></div>
<div class="table-wrap"><table><tr><th>Name</th><th>sbPlayerId (key)</th><th>Appearances</th><th>Events in graph</th><th></th></tr>
{% for p in rows %}<tr><td>{{ p.name }}</td><td>{{ p.sbPlayerId }}</td><td class="num">{{ p.appearances }}</td><td class="num">{{ p.events }}</td><td class="row-actions"><a href="{{ url_for('kg_player_edit', sb_player=p.sbPlayerId) }}">edit / delete</a> · <a href="{{ url_for('kg_events', player=p.name) }}">events</a></td></tr>
{% else %}<tr><td colspan="5">No players found.</td></tr>{% endfor %}</table></div>
{% endblock %}
